```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Kosmetyczne Anna Darasz - Jelenia Góra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #d4a5a5;
            --secondary: #f5e6e8;
            --accent: #9b7e7e;
            --dark: #3a3a3a;
            --light: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background: var(--light);
        }
        
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 2px 20px var(--shadow);
            z-index: 1000;
            padding: 1rem 5%;
        }
        
        nav .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        nav .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        nav ul li a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }
        
        nav ul li a:hover {
            color: var(--primary);
        }
        
        .hero {
            margin-top: 70px;
            background: linear-gradient(135deg, var(--secondary) 0%, #faf0f1 100%);
            padding: 5rem 5% 4rem;
            text-align: center;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .hero-content {
            max-width: 800px;
            animation: fadeInUp 1s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hero h1 {
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        
        .hero p {
            font-size: 1.3rem;
            color: var(--dark);
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .stars {
            color: #ffc107;
            font-size: 1.3rem;
        }
        
        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--primary);
            color: var(--light);
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 165, 165, 0.3);
            margin: 0.5rem;
        }
        
        .cta-button:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 165, 165, 0.4);
        }
        
        .cta-button.secondary {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--accent);
        }
        
        .cta-button.secondary:hover {
            background: var(--primary);
            color: var(--light);
        }
        
        section {
            padding: 4rem 5%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        section h2 {
            text-align: center;
            font-size: 2.3rem;
            color: var(--accent);
            margin-bottom: 3rem;
            position: relative;
            padding-bottom: 1rem;
        }
        
        section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .service-card {
            background: var(--light);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
        }
        
        .service-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        
        .service-card h3 {
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        
        .service-card p {
            color: var(--dark);
            opacity: 0.8;
            line-height: 1.6;
        }
        
        .about {
            background: var(--secondary);
        }
        
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }
        
        .about-text h3 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }
        
        .about-text p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--dark);
            margin-bottom: 1rem;
        }
        
        .about-image {
            background: #c9c9c9;
            height: 350px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .review-card {
            background: var(--light);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px var(--shadow);
            transition: all 0.3s ease;
        }
        
        .review-card:hover {
            transform: scale(1.03);
        }
        
        .review-stars {
            color: #ffc107;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }
        
        .review-text {
            font-style: italic;
            color: var(--dark);
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        
        .review-author {
            font-weight: 600;
            color: var(--accent);
        }
        
        .contact {
            background: var(--secondary);
        }
        
        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }
        
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .contact-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }
        
        .contact-item-icon {
            font-size: 1.8rem;
            margin-top: 0.2rem;
        }
        
        .contact-item-content h3 {
            font-size: 1.1rem;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }
        
        .contact-item-content p {
            font-size: 1rem;
            color: var(--dark);
        }
        
        .contact-item-content a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        
        .map-placeholder {
            background: #c9c9c9;
            height: 250px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 1.5rem;
        }
        
        .contact-form {
            background: var(--light);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px var(--shadow);
        }
        
        .contact-form h3 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .submit-button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: var(--light);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }
        
        footer {
            background: var(--dark);
            color: var(--light);
            text-align: center;
            padding: 2rem 5%;
        }
        
        footer p {
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            nav .container {
                flex-direction: column;
                gap: 1rem;
            }
            
            nav ul {
                gap: 1rem;
                justify-content: center;
            }
            
            .hero {
                padding: 3rem 5% 2rem;
                min-height: 70vh;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero p {
                font-size: 1.1rem;
            }
            
            section h2 {
                font-size: 1.8rem;
            }
            
            .about-content,
            .contact-content {
                grid-template-columns: 1fr;
            }
            
            .services-grid,
            .reviews-grid {
                grid-template-columns: 1fr;
            }
            
            .cta-button {
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            nav ul {
                font-size: 0.9rem;
            }
            
            .hero h1 {
                font-size: 1.6rem;
            }
            
            .hero p {
                font-size: 1rem;
            }
            
            section {
                padding: 3rem 5%;
            }
        }
    </style>
</head>
