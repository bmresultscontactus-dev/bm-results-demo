<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8B4513;
            --secondary: #D4AF37;
            --accent: #F4E4D7;
            --dark: #2C1810;
            --light: #FFF9F0;
            --text: #3E2723;
            --shadow: rgba(139, 69, 19, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--light);
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 249, 240, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px var(--shadow);
            z-index: 1000;
            padding: 1rem 5%;
        }

        nav .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav ul li a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        nav ul li a:hover {
            color: var(--secondary);
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--secondary);
            transition: width 0.3s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        .hero {
            margin-top: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%);
            color: white;
            padding: 120px 5% 100px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '🌸';
            position: absolute;
            font-size: 300px;
            opacity: 0.05;
            top: -50px;
            right: -50px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            opacity: 0.95;
            animation: fadeInUp 1s ease 0.2s both;
        }

        .hero .rating {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .hero .stars {
            color: var(--secondary);
            font-size: 1.5rem;
            margin-right: 0.5rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-button {
            display: inline-block;
            background: var(--secondary);
            color: var(--dark);
            padding: 1rem 3rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            animation: fadeInUp 1s ease 0.4s both;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.6);
            background: #F4E4D7;
        }

        .section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 5%;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 3rem;
            position: relative;
            padding-bottom: 1rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--secondary);
            border-radius: 2px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .service-card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 5px 30px var(--shadow);
            transition: all 0.3s ease;
            text-align: center;
            border: 2px solid transparent;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px var(--shadow);
            border-color: var(--secondary);
        }

        .service-card .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            display: block;
        }

        .service-card h3 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .service-card p {
            color: var(--text);
            line-height: 1.8;
        }

        .about {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 5px 30px var(--shadow);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .about-text h3 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        .about-text p {
            margin-bottom: 1rem;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .about-image {
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            border-radius: 15px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            padding: 2rem;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .review-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px var(--shadow);
            transition: all 0.3s ease;
            position: relative;
        }

        .review-card:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 35px var(--shadow);
        }

        .review-stars {
            color: var(--secondary);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .review-text {
            color: var(--text);
            line-height: 1.8;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .review-author {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .contact-info {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px var(--shadow);
        }

        .contact-item {
            margin-bottom: 2rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .contact-item .icon {
            font-size: 2rem;
            min-width: 40px;
        }

        .contact-item h4 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .contact-item p {
            color: var(--text);
            line-height: 1.6;
        }

        .contact-item a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: bold;
        }

        .map-placeholder {
            background: linear-gradient(135deg, var(--accent), #E8D5C4);
            border-radius: 15px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 2rem;
            box-shadow: 0 5px 25px var(--shadow);
        }

        .contact-form {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px var(--shadow);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem;
            border: 2px solid var(--accent);
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-button {
            background: var(--primary);
            color: white;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .submit-button:hover {
            background: var(--dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 2rem 5%;
            margin-top: 80px;
        }

        footer p {
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            nav .container {
                flex-direction: column;
                gap: 1rem;
            }

            nav ul {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .hero {
                padding: 80px 5% 60px;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .section {
                padding: 60px 5%;
            }

            .section-title {
                font-size: 2rem;
            }

            .about {
                grid-template-columns: 1fr;
            }

            .contact-container {
                grid-template-columns: 1fr;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .reviews-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.7rem;
            }

            .cta-button {
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }

            .service-card {
                padding: 2rem;
            }

            .about {
                padding: 2rem;
            }
        }
    </style>
</head>
