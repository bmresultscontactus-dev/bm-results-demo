```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalotka Centrum Urody - Salon Kosmetyczny Wałbrzych</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4a5a5;
            --secondary: #f7e7e7;
            --accent: #c48b9f;
            --dark: #4a4a4a;
            --light: #fff5f5;
            --white: #ffffff;
            --shadow: rgba(196, 139, 159, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background-color: var(--white);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            background-color: var(--white);
            box-shadow: 0 2px 10px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 0;
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .logo:hover {
            color: var(--primary);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a:hover {
            color: var(--accent);
        }

        .hero {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--light) 100%);
            padding: 120px 20px 80px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '✨';
            position: absolute;
            top: 20px;
            left: 10%;
            font-size: 3rem;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }

        .hero::after {
            content: '💅';
            position: absolute;
            bottom: 40px;
            right: 10%;
            font-size: 3rem;
            opacity: 0.3;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease;
        }

        .hero p {
            font-size: 1.3rem;
            color: var(--dark);
            margin-bottom: 2rem;
            animation: fadeInUp 1.2s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--accent);
            color: var(--white);
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
            animation: fadeInUp 1.4s ease;
        }

        .cta-button:hover {
            background-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        section {
            padding: 80px 20px;
        }

        section h2 {
            text-align: center;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 3rem;
            position: relative;
            padding-bottom: 15px;
        }

        section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background-color: var(--primary);
        }

        .services {
            background-color: var(--light);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .service-card {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 30px var(--shadow);
        }

        .service-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .service-card h3 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .service-card p {
            color: var(--dark);
            line-height: 1.8;
        }

        .about {
            background-color: var(--white);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .about-text p {
            font-size: 1.1rem;
            line-height: 1.9;
            margin-bottom: 1rem;
            color: var(--dark);
        }

        .about-image {
            background-color: var(--secondary);
            height: 400px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 500;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .reviews {
            background-color: var(--secondary);
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .review-card {
            background-color: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 20px var(--shadow);
            transition: all 0.3s ease;
        }

        .review-card:hover {
            transform: scale(1.03);
        }

        .stars {
            color: #ffc107;
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .review-card h4 {
            color: var(--accent);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .review-card p {
            color: var(--dark);
            font-style: italic;
            line-height: 1.7;
        }

        .contact {
            background-color: var(--white);
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: 3rem;
        }

        .contact-info {
            background-color: var(--light);
            padding: 2rem;
            border-radius: 15px;
        }

        .contact-item {
            margin-bottom: 1.5rem;
        }

        .contact-item h3 {
            color: var(--accent);
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-item p {
            color: var(--dark);
            font-size: 1.1rem;
        }

        .contact-item a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .contact-item a:hover {
            color: var(--primary);
        }

        .map-placeholder {
            background-color: var(--secondary);
            height: 300px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: 2rem;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .contact-form {
            background-color: var(--light);
            padding: 2rem;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: var(--white);
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .submit-button:hover {
            background-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        footer {
            background-color: var(--dark);
            color: var(--white);
            text-align: center;
            padding: 2rem 20px;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        .rating-badge {
            display: inline-block;
            background-color: var(--accent);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            nav ul {
                gap: 1rem;
                justify-content: center;
                margin-top: 1rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            section h2 {
                font-size: 2rem;
            }

            .about-content,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .about-image {
                height: 300px;
            }

            .services-grid,
            .reviews-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 80px 20px 60px;
            }

            .hero h1 {
                font-size: 1.7rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .cta-button {
                padding: 12px 30px;
                font-size: 1rem;
            }

            section {
                padding: 60px 20px;
            }

            section h2 {
                font-size: 1.7rem;
            }

            nav .container {
                flex-direction: column;
                gap: 1rem;
            }

            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
        }
    </style>
</head>

        <div class="container">
            <a href="#" class="logo">Zalotka Centrum Urody</a>

    <section class="hero">
