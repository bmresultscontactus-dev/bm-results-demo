```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Fryzjerski Damski Madame - Profesjonalne Fryzjerstwo Damskie w Świdnicy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #D4A5A5;
            --secondary: #F5E6E8;
            --accent: #9B7E7E;
            --dark: #4A3C3C;
            --light: #FFF8F9;
            --white: #FFFFFF;
            --shadow: rgba(148, 118, 118, 0.15);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: var(--dark);
            background-color: var(--light);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        nav {
            background-color: var(--white);
            box-shadow: 0 2px 10px var(--shadow);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .logo:hover {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .hero {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            padding: 150px 20px 100px;
            text-align: center;
            margin-top: 60px;
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--white);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px var(--shadow);
            animation: fadeInUp 1s ease;
        }

        .hero p {
            font-size: 1.3rem;
            color: var(--white);
            margin-bottom: 30px;
            animation: fadeInUp 1.2s ease;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--white);
            color: var(--primary);
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px var(--shadow);
            animation: fadeInUp 1.4s ease;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px var(--shadow);
            background-color: var(--accent);
            color: var(--white);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        section {
            padding: 80px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 50px;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 3px;
            background-color: var(--primary);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .services {
            background-color: var(--white);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .service-card {
            background-color: var(--secondary);
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px var(--shadow);
        }

        .service-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px var(--shadow);
        }

        .service-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .service-card p {
            color: var(--dark);
            font-size: 1rem;
            line-height: 1.6;
        }

        .about {
            background-color: var(--light);
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .about-text p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--dark);
            line-height: 1.8;
        }

        .about-image {
            background-color: var(--secondary);
            height: 400px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .reviews {
            background-color: var(--white);
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .review-card {
            background-color: var(--light);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 10px var(--shadow);
            transition: all 0.3s ease;
        }

        .review-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .stars {
            color: #FFD700;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }

        .review-card p {
            font-style: italic;
            color: var(--dark);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .review-author {
            font-weight: bold;
            color: var(--accent);
            font-style: normal;
        }

        .rating-summary {
            text-align: center;
            margin-bottom: 50px;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .rating-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .contact {
            background-color: var(--secondary);
        }

        .contact-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .contact-info {
            background-color: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 3px 10px var(--shadow);
        }

        .contact-info h3 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .contact-item {
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .contact-item strong {
            color: var(--primary);
            display: block;
            margin-bottom: 5px;
        }

        .contact-item a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-item a:hover {
            color: var(--primary);
        }

        .map-placeholder {
            background-color: var(--light);
            height: 300px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
            margin-top: 30px;
            box-shadow: 0 3px 10px var(--shadow);
        }

        .contact-form {
            background-color: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 3px 10px var(--shadow);
        }

        .contact-form h3 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-button:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow);
        }

        footer {
            background-color: var(--dark);
            color: var(--white);
            text-align: center;
            padding: 30px 20px;
        }

        footer p {
            margin-bottom: 10px;
        }

        .footer-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .nav-links {
                gap: 15px;
                font-size: 0.85rem;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1.1rem;
            }

            .section-title {
                font-size: 2rem;
            }

            .about-content,
            .contact-content {
                grid-template-columns: 1fr;
            }

            .about-image {
                height: 300px;
            }

            .services-grid,
            .reviews-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                display: none;
            }

            .logo {
                font-size: 1.2rem;
            }

            .hero {
                padding: 120px 20px 80px;
            }

            .hero h1 {
                font-size: 1.7rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .cta-button {
                padding: 12px 30px;
                font-size: 1rem;
            }

            section {
                padding: 60px 20px;
            }

            .contact-info,
            .contact-form {
                padding: 25px;
            }
        }
    </style>
</head>
